name: AppImage (Ubuntu 24.04)

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (Ubuntu 24.04, glibc 2.39, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: SRC="$GITHUB_WORKSPACE" OUT="$GITHUB_WORKSPACE/dist" bash packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: QLinuxDeviceManager-AppImage-x86_64-${{ github.sha }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
